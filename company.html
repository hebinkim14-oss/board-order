<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>보드 발주 요청</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css">
<style>
:root{
  --bg:#F7F7F5;--surface:#FFFFFF;--surface2:#F2F1EE;--border:#E5E4E0;--border2:#D4D3CF;
  --text:#1A1A18;--text2:#6B6B67;--text3:#9B9B97;
  --blue:#1A56DB;--blue-light:#EBF0FF;
  --green:#16A34A;--green-light:#DCFCE7;
  --red:#DC2626;--red-light:#FEE2E2;
  --amber:#D97706;--amber-light:#FEF3C7;
  --purple-light:#EDE9FE;--orange-light:#FFF7ED;
  --radius:8px;--radius-lg:12px;
  --shadow:0 1px 3px rgba(0,0,0,.08);
  --shadow-md:0 4px 6px rgba(0,0,0,.07);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;min-height:100vh}

.header{background:var(--surface);border-bottom:1px solid var(--border);padding:0 20px;height:56px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;box-shadow:var(--shadow)}
.header h1{font-size:16px;font-weight:700;color:var(--text)}
.header p{font-size:12px;color:var(--text3)}
.header-badge{background:var(--green-light);color:var(--green);font-size:11px;font-weight:600;padding:3px 10px;border-radius:20px;border:1px solid #6EE7B7}

.content{max-width:680px;margin:0 auto;padding:20px 16px 40px}

/* Step indicator */
.steps{display:flex;align-items:center;gap:6px;margin-bottom:24px;padding:14px 16px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow)}
.step{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:500;color:var(--text3)}
.step.active{color:var(--blue);font-weight:700}
.step.done{color:var(--green)}
.step-num{width:22px;height:22px;border-radius:50%;border:1.5px solid currentColor;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0}
.step.done .step-num{background:var(--green);border-color:var(--green);color:#fff}
.step-divider{flex:1;height:1px;background:var(--border)}

/* Cards */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow);overflow:hidden;margin-bottom:14px}
.card-header{padding:14px 16px;border-bottom:1px solid var(--border);background:var(--surface2)}
.card-header h2{font-size:14px;font-weight:700;display:flex;align-items:center;gap:6px}
.card-header p{font-size:12px;color:var(--text3);margin-top:2px}
.card-body{padding:16px}

/* Week nav */
.week-nav{display:flex;align-items:center;gap:8px;margin-bottom:0}
.week-nav button{background:none;border:1px solid var(--border);border-radius:var(--radius);padding:6px 12px;cursor:pointer;font-size:13px;color:var(--text2);transition:all .15s;font-family:inherit;font-weight:500}
.week-nav button:hover{border-color:var(--blue);color:var(--blue)}
.week-label{font-size:14px;font-weight:600;flex:1;text-align:center;color:var(--text)}

/* Day tabs */
.day-tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-bottom:0}
.day-tab{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius-lg);padding:10px 4px;text-align:center;cursor:pointer;transition:all .15s;box-shadow:var(--shadow)}
.day-tab:hover{border-color:var(--blue)}
.day-tab.active{border:2.5px solid var(--blue);box-shadow:0 0 0 3px rgba(26,86,219,.1)}
.day-tab .dow{font-size:11px;color:var(--text3);margin-bottom:3px;font-weight:500}
.day-tab.active .dow{color:var(--blue);font-weight:700}
.day-tab .ddate{font-size:15px;font-weight:600;color:var(--text)}
.day-tab.active .ddate{color:var(--blue)}
.day-tab .has-dot{width:5px;height:5px;border-radius:50%;background:var(--green);margin:3px auto 0}
.day-tab .no-dot{height:8px}

/* Company select */
.company-grid{display:flex;flex-wrap:wrap;gap:6px}
.company-btn{padding:8px 16px;border:1.5px solid var(--border);border-radius:20px;background:var(--surface);cursor:pointer;font-size:13px;color:var(--text2);transition:all .15s;font-family:inherit;font-weight:500;box-shadow:var(--shadow)}
.company-btn:hover{border-color:var(--blue);color:var(--blue)}
.company-btn.selected{border:2.5px solid var(--blue)!important;color:var(--blue);font-weight:700;background:var(--blue-light)}

/* Order table */
table.order-table{width:100%;border-collapse:collapse;font-size:13px}
table.order-table th{padding:8px 10px;text-align:left;font-size:11px;font-weight:600;color:var(--text3);border-bottom:1px solid var(--border);background:var(--surface2);text-transform:uppercase;letter-spacing:.03em;white-space:nowrap}
table.order-table td{padding:8px 10px;border-bottom:1px solid var(--border);vertical-align:middle}
table.order-table tr:last-child td{border-bottom:none}
table.order-table tr.row-mfc-ww td{background:var(--purple-light)}
table.order-table tr.row-mfc-iv td{background:var(--orange-light)}
table.order-table tr.row-mfc-ww.group-start td{border-top:2px solid #A78BFA}
table.order-table tr.row-mfc-iv.group-start td{border-top:2px solid #FB923C}
.qty-input{width:72px;padding:6px 8px;border:1px solid var(--border);border-radius:var(--radius);font-size:13px;text-align:center;background:#fff;color:var(--text);font-family:inherit;transition:border-color .15s}
.qty-input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 2px rgba(26,86,219,.1)}

/* Note */
.note-row{display:flex;align-items:center;gap:8px;margin-top:12px}
.note-label{font-size:12px;color:var(--text3);white-space:nowrap;font-weight:500}
.note-input{flex:1;padding:8px 10px;border:1px solid var(--border);border-radius:var(--radius);font-size:13px;background:#fff;color:var(--text);font-family:inherit}
.note-input:focus{outline:none;border-color:var(--blue)}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:6px;padding:10px 20px;border-radius:var(--radius);font-size:14px;font-weight:600;cursor:pointer;border:none;transition:all .15s;font-family:inherit}
.btn-primary{background:var(--blue);color:#fff;width:100%;justify-content:center}
.btn-primary:hover{background:#1345B5}
.btn-primary:active{transform:scale(.98)}
.btn-secondary{background:var(--surface);color:var(--text2);border:1px solid var(--border)}

/* Success state */
.success-banner{background:var(--green-light);border:1px solid #6EE7B7;border-radius:var(--radius-lg);padding:16px;display:flex;align-items:center;gap:12px;margin-bottom:14px}
.success-banner i{font-size:24px;color:var(--green)}
.success-banner p{font-size:13px;color:#065F46;font-weight:500}

/* Confirmation */
.confirm-card{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-lg);padding:14px;margin-bottom:14px}
.confirm-card h3{font-size:13px;font-weight:700;margin-bottom:10px;color:var(--text2)}
.confirm-row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--border);font-size:13px}
.confirm-row:last-child{border-bottom:none}
.confirm-row .label{color:var(--text2)}
.confirm-row .value{font-weight:600}

/* Empty */
.empty{text-align:center;padding:32px 20px;color:var(--text3)}
.empty i{font-size:32px;margin-bottom:8px;display:block}
.empty p{font-size:13px}

/* Toast */
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1A1A18;color:#F7F7F5;padding:10px 20px;border-radius:var(--radius);font-size:13px;font-weight:500;opacity:0;transition:opacity .3s;pointer-events:none;z-index:999;box-shadow:var(--shadow-md)}
.toast.show{opacity:1}

/* Submitted orders summary */
.submitted-list{margin-top:14px}
.submitted-item{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;margin-bottom:8px;box-shadow:var(--shadow)}
.submitted-item-hdr{padding:10px 14px;background:var(--surface2);display:flex;align-items:center;justify-content:space-between;cursor:pointer}
.submitted-item-hdr h4{font-size:13px;font-weight:600}
.submitted-item-body{display:none;padding:12px 14px;border-top:1px solid var(--border)}
.submitted-item-body.open{display:block}
.pill{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border:1px solid var(--border);border-radius:20px;font-size:12px;background:var(--surface2)}
.pill .qty{font-weight:700;color:var(--blue)}
.pills{display:flex;flex-wrap:wrap;gap:5px}

@media(max-width:480px){
  .content{padding:14px 12px 40px}
  .day-tabs{gap:3px}
  .day-tab{padding:8px 2px}
  .day-tab .ddate{font-size:13px}
  table.order-table{font-size:12px}
  table.order-table th,table.order-table td{padding:6px 6px}
  .qty-input{width:60px}
}
</style>
</head>
<body>

<header class="header">
  <div>
    <h1><span style="font-size:13px;font-weight:700;background:var(--blue);color:#fff;padding:2px 7px;border-radius:4px;margin-right:6px">BOARD</span>보드 발주 요청</h1>
    <p>차주 보드 오더를 입력해 주세요</p>
  </div>
  <span class="header-badge"><i class="ti ti-building" style="font-size:11px"></i> 업체용</span>
</header>

<div class="content">

  <!-- Steps -->
  <div class="steps">
    <div class="step" id="step1"><div class="step-num">1</div><span>오더 주간</span></div>
    <div class="step-divider"></div>
    <div class="step" id="step2"><div class="step-num">2</div><span>업체 선택</span></div>
    <div class="step-divider"></div>
    <div class="step" id="step3"><div class="step-num">3</div><span>오더 요청일</span></div>
    <div class="step-divider"></div>
    <div class="step" id="step4"><div class="step-num">4</div><span>수량 입력</span></div>
  </div>

  <!-- Week select -->
  <div class="card">
    <div class="card-header">
      <h2><i class="ti ti-calendar"></i> 오더 주간</h2>
      <p>오더 주간을 선택하세요</p>
    </div>
    <div class="card-body">
      <div class="week-nav">
        <button onclick="changeWeek(-1)">← 이전</button>
        <span class="week-label" id="week-label"></span>
        <button onclick="changeWeek(1)">다음 →</button>
      </div>
    </div>
  </div>

  <!-- Company select -->
  <div class="card">
    <div class="card-header">
      <h2><i class="ti ti-building"></i> 업체 선택</h2>
    </div>
    <div class="card-body">
      <div class="company-grid" id="company-grid"></div>
    </div>
  </div>

  <!-- Day select -->
  <div class="card">
    <div class="card-header">
      <h2><i class="ti ti-calendar-week"></i> 오더 요청일</h2>
      <p>노란색 음영이 표시된 날짜는 이미 오더가 있습니다</p>
    </div>
    <div class="card-body">
      <div class="day-tabs" id="day-tabs"></div>
    </div>
  </div>

  <!-- Order form -->
  <div id="order-section">
    <div class="empty"><i class="ti ti-arrow-up"></i><p>업체와 요일을 선택하면 주문 입력창이 나타납니다</p></div>
  </div>

  <!-- Already submitted orders -->
  <div id="submitted-section" style="display:none">
    <div class="card">
      <div class="card-header">
        <h2><i class="ti ti-check"></i> 이번 주 입력된 오더</h2>
        <p>선택한 업체의 주간 오더 현황입니다</p>
      </div>
      <div class="card-body" id="submitted-list"></div>
    </div>
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
const DAYS_KO=['일','월','화','수','목','금','토'];
const MFC_TYPES=['MFC (WW)','MFC (IV)'];
const ROW_STYLE={'MDF':'','PB':'','MFC (WW)':'row-mfc-ww','MFC (IV)':'row-mfc-iv'};

// Load shared state from localStorage (same key as admin)
const KEY='boardOrderState_v1';
let state=loadState();
let compSelectedDay=null;
let compSelectedCompany=null;
let weekOffset=0;
let openItems={};

function loadState(){
  try{const s=localStorage.getItem(KEY);return s?JSON.parse(s):defaultState();}
  catch{return defaultState();}
}
function defaultState(){return{
  companies:['부림','목림','프린테크','메닉스','충주공장','진산(삼죽)','동방','혜윰','태종산업'],
  carriers:['부림운송','목림운송'],mfcAllowed:['충주공장'],
  boards:[
    {type:'MDF',material:'2.7',size:'4*8',warehouse:'해성'},{type:'MDF',material:'2.7',size:'4*6',warehouse:'해성'},
    {type:'MDF',material:'4.5',size:'4*8',warehouse:'우인'},{type:'MDF',material:'4.5',size:'4*7',warehouse:'우인'},
    {type:'PB',material:'12',size:'4*8',warehouse:'해성'},{type:'PB',material:'15',size:'4*6',warehouse:'우인'},
    {type:'PB',material:'15',size:'4*8',warehouse:'우인'},{type:'PB',material:'15',size:'6*8',warehouse:'해성'},
    {type:'PB',material:'18',size:'4*6',warehouse:'해성'},{type:'PB',material:'18',size:'4*8',warehouse:'우인'},
    {type:'PB',material:'18',size:'6*8',warehouse:'해성'},{type:'PB',material:'22',size:'4*6',warehouse:'해성'},
    {type:'PB',material:'22',size:'4*8',warehouse:'해성'},{type:'PB',material:'22',size:'6*8',warehouse:'해성'},
    {type:'PB',material:'28',size:'4*8',warehouse:'해성'},{type:'PB',material:'28',size:'4*5.3',warehouse:'해성'},
    {type:'PB',material:'28',size:'6*8',warehouse:'해성'},
    {type:'MFC (WW)',material:'15',size:'4*8',warehouse:'해성'},{type:'MFC (WW)',material:'18',size:'4*8',warehouse:'해성'},
    {type:'MFC (WW)',material:'22',size:'4*8',warehouse:'해성'},{type:'MFC (WW)',material:'28',size:'4*8',warehouse:'해성'},
    {type:'MFC (IV)',material:'15',size:'4*8',warehouse:'해성'},{type:'MFC (IV)',material:'18',size:'4*8',warehouse:'해성'},
    {type:'MFC (IV)',material:'22',size:'4*8',warehouse:'해성'},
  ],
  orders:{},selectedDay:null,selectedCompany:null,
  weekOffset:0,summaryWeekOffset:0,mailWeekOffset:0,excelWeekOffset:0,
  selectedCarrier:null,senderName:'담당자',mailSubject:'[보드발주] {주간} 배차 요청'
};}
function saveState(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch{}}

function isMfcAllowed(c){return state.mfcAllowed.includes(c);}
function visibleBoards(c){
  if(isMfcAllowed(c))return state.boards.map((b,i)=>({b,i}));
  return state.boards.map((b,i)=>({b,i})).filter(({b})=>!MFC_TYPES.includes(b.type));
}
function getMonday(offset=0){
  const now=new Date(),day=now.getDay();
  const diff=now.getDate()-day+(day===0?-6:1)+offset*7;
  const mon=new Date(now);mon.setDate(diff);mon.setHours(0,0,0,0);return mon;
}
function getWeekDays(offset=0){const mon=getMonday(offset);return Array.from({length:5},(_,i)=>{const d=new Date(mon);d.setDate(mon.getDate()+i);return d;});}
function fmtDate(d){return `${d.getMonth()+1}/${d.getDate()}`}
function fmtFull(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function fmtWeekRange(offset=0){const d=getWeekDays(offset);return `${d[0].getMonth()+1}월 ${d[0].getDate()}일 ~ ${d[4].getMonth()+1}월 ${d[4].getDate()}일`}
function orderKey(ds,c){return `${ds}::${c}`}
function fmtQty(val){if(!val)return '';const t=String(val).trim();return /^\d+(\.\d+)?$/.test(t)?t+'CT':t;}
function hasRealItem(it){return it&&it.qty&&String(it.qty).trim()!==''&&it.qty!=='0';}
function companyHasOrderOnDay(company,ds){
  if(!company)return false;
  const ord=state.orders[orderKey(ds,company)];if(!ord)return false;
  return Object.values(ord.items).some(it=>hasRealItem(it))||(ord.note&&ord.note.trim()!=='');
}

// Update steps
function updateSteps(){
  const s1=document.getElementById('step1'),s2=document.getElementById('step2'),s3=document.getElementById('step3'),s4=document.getElementById('step4');
  [s1,s2,s3,s4].forEach(s=>{s.classList.remove('active','done');});
  if(compSelectedDay&&compSelectedCompany){s1.classList.add('done');s2.classList.add('done');s3.classList.add('done');s4.classList.add('active');}
  else if(compSelectedDay){s1.classList.add('done');s2.classList.add('done');s3.classList.add('active');}
  else if(compSelectedCompany){s1.classList.add('done');s2.classList.add('active');}
  else{s1.classList.add('active');}
}

// Week
function changeWeek(dir){weekOffset+=dir;renderWeek();renderDayTabs();renderOrderSection();}
function renderWeek(){document.getElementById('week-label').textContent=fmtWeekRange(weekOffset);}

// Company
function renderCompanyGrid(){
  document.getElementById('company-grid').innerHTML=state.companies.map(c=>
    `<button class="company-btn ${compSelectedCompany===c?'selected':''}" onclick="selectCompany('${c}')">${c}</button>`
  ).join('');
}
function selectCompany(c){
  compSelectedCompany=c;
  renderCompanyGrid();
  renderDayTabs();
  renderOrderSection();
  renderSubmittedOrders();
  updateSteps();
}

// Day tabs
function renderDayTabs(){
  const days=getWeekDays(weekOffset);
  document.getElementById('day-tabs').innerHTML=days.map(d=>{
    const ds=fmtFull(d),isActive=compSelectedDay===ds;
    const hasOrder=companyHasOrderOnDay(compSelectedCompany,ds);
    const ddateStyle=hasOrder?'background:#FFF176;border-radius:4px;padding:2px 5px':'';
    return `<div class="day-tab${isActive?' active':''}" onclick="selectDay('${ds}')">
      <div class="dow">${DAYS_KO[d.getDay()]}요일</div>
      <div class="ddate" style="${ddateStyle}">${fmtDate(d)}</div>
      ${hasOrder?'<div class="has-dot"></div>':'<div class="no-dot"></div>'}
    </div>`;
  }).join('');
}
function selectDay(ds){compSelectedDay=ds;renderDayTabs();renderOrderSection();updateSteps();}

// Order section
function renderOrderSection(){
  const el=document.getElementById('order-section');
  if(!compSelectedDay||!compSelectedCompany){
    el.innerHTML=`<div class="empty"><i class="ti ti-arrow-up"></i><p>업체와 요일을 선택하면 주문 입력창이 나타납니다</p></div>`;return;
  }
  const ds=compSelectedDay,key=orderKey(ds,compSelectedCompany);
  if(!state.orders[key])state.orders[key]={items:{},note:''};
  const ord=state.orders[key];
  const d=new Date(ds);
  const filtered=visibleBoards(compSelectedCompany);
  let rows='',lastType=null;
  filtered.forEach(({b,i})=>{
    const base=ROW_STYLE[b.type]||'',gs=b.type!==lastType&&base?'group-start':'';lastType=b.type;
    const it=ord.items[i]||{qty:'',flag:''},qty=it.qty||'';
    const cls=[base,gs].filter(Boolean).join(' ');
    rows+=`<tr class="${cls}">
      <td>${b.type}</td><td>${b.material}</td><td>${b.size}</td><td>${b.warehouse||'—'}</td>
      <td><input class="qty-input" type="text" value="${qty}" placeholder="-" onchange="setQty(${i},this.value)" onfocus="this.select()" inputmode="decimal"></td>
    </tr>`;
  });
  el.innerHTML=`<div class="card">
    <div class="card-header">
      <h2><i class="ti ti-edit"></i> ${d.getMonth()+1}월 ${d.getDate()}일 (${DAYS_KO[d.getDay()]}) · ${compSelectedCompany}</h2>
      <p>수량을 입력하세요. 숫자=CT, 예외시 직접 기재 (예: 3BD)</p>
    </div>
    <table class="order-table">
      <thead><tr><th>구분</th><th>자재</th><th>사이즈</th><th>창고</th><th>수량</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
    <div style="padding:14px 16px;border-top:1px solid var(--border);background:#FAFAF8">
      <div class="note-row" style="margin-top:0;margin-bottom:14px">
        <span class="note-label">특이사항</span>
        <input class="note-input" type="text" value="${ord.note||''}" placeholder="취소, 변경사항 등 특이사항 입력" onchange="setNote(this.value)">
      </div>
      <button class="btn btn-primary" onclick="submitOrder()"><i class="ti ti-send"></i>오더 저장</button>
    </div>
  </div>`;
}

function setQty(idx,val){
  const key=orderKey(compSelectedDay,compSelectedCompany);
  if(!state.orders[key])state.orders[key]={items:{},note:''};
  if(!state.orders[key].items[idx])state.orders[key].items[idx]={qty:'',flag:''};
  state.orders[key].items[idx].qty=String(val).trim();
}
function setNote(val){
  const key=orderKey(compSelectedDay,compSelectedCompany);
  if(!state.orders[key])state.orders[key]={items:{},note:''};
  state.orders[key].note=val;
}
function submitOrder(){
  saveState();
  renderDayTabs();
  renderSubmittedOrders();
  showToast('오더가 저장됐습니다 ✓');
  // Show success briefly then re-render
  const el=document.getElementById('order-section');
  const d=new Date(compSelectedDay);
  el.innerHTML=`<div class="success-banner"><i class="ti ti-circle-check-filled"></i><div><p style="font-weight:700;margin-bottom:2px">저장 완료!</p><p>${d.getMonth()+1}월 ${d.getDate()}일 (${DAYS_KO[d.getDay()]}) 오더가 저장됐습니다.</p></div></div>`;
  setTimeout(()=>renderOrderSection(),2000);
}

// Submitted orders
function renderSubmittedOrders(){
  const sec=document.getElementById('submitted-section');
  const listEl=document.getElementById('submitted-list');
  if(!compSelectedCompany){sec.style.display='none';return;}
  const days=getWeekDays(weekOffset);
  let items=[];
  days.forEach(d=>{
    const ds=fmtFull(d),key=orderKey(ds,compSelectedCompany);
    const ord=state.orders[key];if(!ord)return;
    const hasItems=Object.values(ord.items).some(it=>hasRealItem(it));
    if(!hasItems&&!ord.note)return;
    items.push({d,ds,ord});
  });
  if(!items.length){sec.style.display='none';return;}
  sec.style.display='block';
  listEl.innerHTML=items.map(({d,ds,ord})=>{
    const validItems=Object.entries(ord.items).filter(([,it])=>hasRealItem(it));
    const cardId='si-'+ds;const isOpen=openItems[cardId];
    let pills=validItems.map(([i,it])=>{const b=state.boards[i];return b?`<span class="pill">${b.type} ${b.material} ${b.size}<span class="qty">${fmtQty(it.qty)}</span></span>`:''}).join('');
    if(ord.note)pills+=`<span class="pill" style="background:var(--amber-light);border-color:#FCD34D">※ ${ord.note}</span>`;
    return `<div class="submitted-item">
      <div class="submitted-item-hdr" onclick="toggleSubmitted('${cardId}')">
        <h4>${d.getMonth()+1}월 ${d.getDate()}일 (${DAYS_KO[d.getDay()]}) <span style="font-size:11px;color:var(--text3);font-weight:400">${validItems.length}건</span></h4>
        <i class="ti ti-chevron-${isOpen?'up':'down'}" style="color:var(--text3);font-size:14px"></i>
      </div>
      <div class="submitted-item-body ${isOpen?'open':''}" id="${cardId}"><div class="pills">${pills}</div></div>
    </div>`;
  }).join('');
}
function toggleSubmitted(cardId){
  openItems[cardId]=!openItems[cardId];renderSubmittedOrders();
}

function showToast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2500);}

// Init
renderWeek();
renderCompanyGrid();
renderDayTabs();
updateSteps();

// Sync with admin updates every 5 seconds
setInterval(()=>{
  const fresh=loadState();
  state=fresh;
  renderCompanyGrid();
  renderDayTabs();
  if(compSelectedDay&&compSelectedCompany)renderSubmittedOrders();
},5000);
</script>
</body>
