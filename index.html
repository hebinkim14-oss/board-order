<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>보드 발주 시스템 | 관리자</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#F7F7F5;--surface:#FFFFFF;--surface2:#F2F1EE;--border:#E5E4E0;--border2:#D4D3CF;
  --text:#1A1A18;--text2:#6B6B67;--text3:#9B9B97;
  --blue:#1A56DB;--blue-light:#EBF0FF;--blue-mid:#3B7DD8;
  --green:#16A34A;--green-light:#DCFCE7;
  --red:#DC2626;--red-light:#FEE2E2;
  --amber:#D97706;--amber-light:#FEF3C7;
  --purple-light:#EDE9FE;--purple:#6D28D9;
  --orange-light:#FFF7ED;--orange:#C2410C;
  --radius:8px;--radius-lg:12px;--radius-xl:16px;
  --shadow:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.06);
  --shadow-md:0 4px 6px rgba(0,0,0,.07),0 2px 4px rgba(0,0,0,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;min-height:100vh}

/* Layout */
.app-shell{display:flex;min-height:100vh}
.sidebar{width:220px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;z-index:100}
.main{margin-left:220px;flex:1;display:flex;flex-direction:column;min-height:100vh}
.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:0 24px;height:56px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50}
.content{padding:24px;flex:1}

/* Sidebar */
.sidebar-logo{padding:20px 16px 12px;border-bottom:1px solid var(--border)}
.sidebar-logo h1{font-size:15px;font-weight:700;color:var(--text);letter-spacing:-.3px}
.sidebar-logo p{font-size:11px;color:var(--text3);margin-top:2px}
.sidebar-badge{display:inline-block;background:var(--blue);color:#fff;font-size:10px;font-weight:600;padding:1px 6px;border-radius:20px;margin-left:6px;vertical-align:middle}
.sidebar-nav{padding:12px 8px;flex:1}
.nav-section{font-size:10px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.08em;padding:8px 8px 4px}
.nav-item{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:var(--radius);cursor:pointer;color:var(--text2);font-size:13px;font-weight:500;transition:all .15s;margin-bottom:2px;border:none;background:none;width:100%;text-align:left}
.nav-item:hover{background:var(--surface2);color:var(--text)}
.nav-item.active{background:var(--blue-light);color:var(--blue);font-weight:600}
.nav-item i{font-size:16px;flex-shrink:0}
.sidebar-footer{padding:12px;border-top:1px solid var(--border)}
.company-link-box{background:var(--blue-light);border:1px solid #BFCFFF;border-radius:var(--radius);padding:10px 12px}
.company-link-box p{font-size:11px;color:var(--blue);font-weight:600;margin-bottom:4px}
.company-link-box input{width:100%;font-size:11px;border:1px solid #BFCFFF;border-radius:4px;padding:4px 6px;background:#fff;color:var(--text);outline:none;font-family:inherit}
.company-link-btn{display:flex;gap:4px;margin-top:6px}
.company-link-btn button{flex:1;font-size:11px;padding:4px;border-radius:4px;border:1px solid #BFCFFF;background:var(--blue);color:#fff;cursor:pointer;font-family:inherit;font-weight:500}
.company-link-btn button.sec{background:#fff;color:var(--blue)}

/* Topbar */
.topbar-title{font-size:16px;font-weight:600;color:var(--text)}
.topbar-right{display:flex;align-items:center;gap:8px}
.week-nav{display:flex;align-items:center;gap:8px}
.week-nav button{background:none;border:1px solid var(--border);border-radius:var(--radius);padding:5px 10px;cursor:pointer;font-size:13px;color:var(--text2);transition:all .15s;font-family:inherit}
.week-nav button:hover{border-color:var(--blue);color:var(--blue)}
.week-label{font-size:14px;font-weight:600;min-width:160px;text-align:center;color:var(--text)}
.week-badge{font-size:11px;font-weight:600;padding:2px 8px;border-radius:20px;background:var(--blue-light);color:var(--blue)}

/* Cards */
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px 20px;box-shadow:var(--shadow)}
.stat-card .num{font-size:28px;font-weight:700;color:var(--text);line-height:1}
.stat-card .lbl{font-size:12px;color:var(--text3);margin-top:4px;font-weight:500}

/* Day tabs */
.day-tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:20px}
.day-tab{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius-lg);padding:10px 6px;text-align:center;cursor:pointer;transition:all .15s;box-shadow:var(--shadow)}
.day-tab:hover{border-color:var(--blue-mid)}
.day-tab.active{border:2.5px solid var(--blue);box-shadow:0 0 0 3px rgba(26,86,219,.1)}
.day-tab .dow{font-size:11px;color:var(--text3);margin-bottom:3px;font-weight:500}
.day-tab.active .dow{color:var(--blue);font-weight:600}
.day-tab .ddate{font-size:15px;font-weight:600;color:var(--text)}
.day-tab.active .ddate{color:var(--blue)}
.day-tab .dot{width:6px;height:6px;border-radius:50%;background:var(--green);margin:4px auto 0}
.day-tab .dot-empty{height:10px}

/* Company select */
.company-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:20px}
.company-btn{padding:6px 14px;border:1.5px solid var(--border);border-radius:20px;background:var(--surface);cursor:pointer;font-size:13px;color:var(--text2);transition:all .15s;font-family:inherit;font-weight:500;box-shadow:var(--shadow)}
.company-btn:hover{border-color:var(--blue-mid);color:var(--blue)}
.company-btn.selected{border:2.5px solid var(--blue)!important;color:var(--blue);font-weight:700;background:var(--blue-light)}

/* Order table */
.order-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow-md);overflow:hidden}
.order-card-header{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--border);background:var(--surface2)}
.order-card-header h3{font-size:14px;font-weight:600}
table.order-table{width:100%;border-collapse:collapse;font-size:13px}
table.order-table th{padding:8px 12px;text-align:left;font-size:11px;font-weight:600;color:var(--text3);border-bottom:1px solid var(--border);background:var(--surface2);text-transform:uppercase;letter-spacing:.04em;white-space:nowrap}
table.order-table td{padding:8px 12px;border-bottom:1px solid var(--border);vertical-align:middle}
table.order-table tr:last-child td{border-bottom:none}
table.order-table tr.row-mfc-ww td{background:var(--purple-light)}
table.order-table tr.row-mfc-iv td{background:var(--orange-light)}
table.order-table tr.row-mfc-ww.group-start td{border-top:2px solid #A78BFA}
table.order-table tr.row-mfc-iv.group-start td{border-top:2px solid #FB923C}
table.order-table tr.row-cancel td{background:var(--red-light)!important}
table.order-table tr.row-cancel td:first-child{border-left:3px solid var(--red)}
table.order-table tr.row-add td{background:var(--green-light)!important}
table.order-table tr.row-add td:first-child{border-left:3px solid var(--green)}

.qty-input{width:72px;padding:5px 8px;border:1px solid var(--border);border-radius:var(--radius);font-size:13px;text-align:center;background:#fff;color:var(--text);font-family:inherit;transition:border-color .15s}
.qty-input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 2px rgba(26,86,219,.1)}
.flag-cell{display:flex;gap:4px}
.flag-btn{padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600;cursor:pointer;border:1px solid;background:transparent;transition:all .15s;font-family:inherit}
.flag-btn.cancel{border-color:#FCA5A5;color:var(--red)}
.flag-btn.cancel.active{background:var(--red-light);border-color:var(--red)}
.flag-btn.add{border-color:#6EE7B7;color:var(--green)}
.flag-btn.add.active{background:var(--green-light);border-color:var(--green)}

/* Warehouse cell */
.wh-cell{cursor:pointer;display:inline-flex;align-items:center;gap:4px;color:var(--text)}
.wh-cell i{font-size:11px;color:var(--text3);opacity:0;transition:opacity .15s}
.wh-cell:hover i{opacity:1}
.wh-input{width:72px;padding:4px 6px;border:1px solid var(--blue);border-radius:4px;font-size:13px;background:#fff;color:var(--text);outline:none;font-family:inherit}

/* Note */
.note-row{display:flex;align-items:center;gap:10px;padding:10px 18px;background:#FAFAF8;border-top:1px solid var(--border)}
.note-input{flex:1;padding:6px 10px;border:1px solid var(--border);border-radius:var(--radius);font-size:13px;background:#fff;color:var(--text);font-family:inherit}
.note-input:focus{outline:none;border-color:var(--blue)}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:var(--radius);font-size:13px;font-weight:600;cursor:pointer;border:none;transition:all .15s;font-family:inherit}
.btn-primary{background:var(--blue);color:#fff}
.btn-primary:hover{background:#1345B5}
.btn-secondary{background:var(--surface);color:var(--text2);border:1px solid var(--border)}
.btn-secondary:hover{background:var(--surface2);border-color:var(--border2)}
.btn-green{background:var(--green);color:#fff}
.btn-green:hover{background:#15803D}
.btn-danger{background:var(--red-light);color:var(--red);border:1px solid #FCA5A5}
.btn-danger:hover{background:#FEE2E2}
.btn-sm{padding:5px 10px;font-size:12px}
.btn-row{display:flex;gap:8px;padding:12px 18px;background:#FAFAF8;border-top:1px solid var(--border)}

/* Summary */
.company-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;margin-bottom:10px;box-shadow:var(--shadow)}
.company-card-hdr{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--surface2);cursor:pointer;user-select:none;transition:background .15s}
.company-card-hdr:hover{background:#ECEAE6}
.company-card-hdr .name{font-size:14px;font-weight:600}
.company-card-body{display:none;padding:14px 16px;border-top:1px solid var(--border)}
.company-card-body.open{display:block}
.chevron{transition:transform .2s;color:var(--text3);font-size:14px}
.chevron.open{transform:rotate(180deg)}
.day-group{margin-bottom:12px}
.day-group:last-child{margin-bottom:0}
.day-group-hdr{font-size:12px;font-weight:600;color:var(--text3);margin-bottom:6px;display:flex;align-items:center;gap:6px}
.pills{display:flex;flex-wrap:wrap;gap:5px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border:1px solid var(--border);border-radius:20px;font-size:12px;background:var(--surface2);color:var(--text)}
.pill .qty{font-weight:700;color:var(--blue)}
.pill.is-cancel{background:var(--red-light);border-color:#FCA5A5}
.pill.is-cancel .qty{color:var(--red)}
.pill.is-add{background:var(--green-light);border-color:#6EE7B7}
.pill.is-add .qty{color:var(--green)}
.pill-tag{font-size:10px;font-weight:700;padding:1px 5px;border-radius:10px}
.pill-tag.cancel{background:#FECACA;color:var(--red)}
.pill-tag.add{background:#6EE7B7;color:#065F46}
.note-pill{padding:4px 10px;border-radius:20px;font-size:12px;background:var(--amber-light);border:1px solid #FCD34D;color:var(--amber)}
.change-section{margin-top:8px;border-top:1px solid var(--border);padding-top:8px}
.change-label{font-size:11px;font-weight:600;color:var(--text3);margin-bottom:5px;display:flex;align-items:center;gap:4px}
.day-divider{height:1px;background:var(--border);margin:10px 0}

/* Mail */
.mail-preview{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);padding:14px;font-size:13px;white-space:pre-wrap;font-family:'Courier New',monospace;line-height:1.7;max-height:320px;overflow-y:auto;margin-bottom:14px;color:var(--text)}

/* Settings */
.settings-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:18px 20px;margin-bottom:14px;box-shadow:var(--shadow)}
.settings-card h3{font-size:14px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:6px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.tag{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;background:var(--surface2);border:1px solid var(--border);border-radius:20px;font-size:13px}
.tag button{background:none;border:none;cursor:pointer;color:var(--text3);font-size:15px;line-height:1;padding:0;display:flex;align-items:center}
.add-row{display:flex;gap:6px}
.add-row input{flex:1;padding:7px 10px;border:1px solid var(--border);border-radius:var(--radius);font-size:13px;font-family:inherit;background:#fff;color:var(--text)}
.add-row input:focus{outline:none;border-color:var(--blue)}
.board-table{width:100%;border-collapse:collapse;font-size:13px;margin-bottom:10px}
.board-table th{padding:7px 10px;text-align:left;font-size:11px;font-weight:600;color:var(--text3);border-bottom:1px solid var(--border);background:var(--surface2)}
.board-table td{padding:6px 10px;border-bottom:1px solid var(--border);vertical-align:middle}
.board-table tr:last-child td{border-bottom:none}
.mfc-grid{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.mfc-label{display:flex;align-items:center;gap:6px;padding:5px 12px;border:1px solid var(--border);border-radius:20px;cursor:pointer;font-size:13px;user-select:none;background:#fff;transition:all .15s}
.mfc-label input{accent-color:var(--blue);width:14px;height:14px}
.mfc-label.checked{background:var(--purple-light);border-color:#A78BFA;color:var(--purple);font-weight:600}

/* Upload */
.upload-zone{border:2px dashed var(--border2);border-radius:var(--radius-lg);padding:24px;text-align:center;cursor:pointer;transition:all .15s;background:#FAFAF8}
.upload-zone:hover,.upload-zone.drag{border-color:var(--blue);background:var(--blue-light)}
.upload-zone i{font-size:28px;color:var(--text3)}
.upload-zone p{font-size:13px;color:var(--text2);margin-top:8px}
.file-info{display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--green-light);border:1px solid #6EE7B7;border-radius:var(--radius);font-size:13px;margin-bottom:10px}
.file-info .fname{flex:1;font-weight:600;color:var(--green)}
.file-info button{background:none;border:none;cursor:pointer;color:var(--text3);font-size:18px;line-height:1}

/* Empty */
.empty{text-align:center;padding:40px 20px;color:var(--text3)}
.empty i{font-size:36px;margin-bottom:8px;display:block}

/* Toast */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1A1A18;color:#F7F7F5;padding:10px 20px;border-radius:var(--radius);font-size:13px;font-weight:500;opacity:0;transition:opacity .3s;pointer-events:none;z-index:999;white-space:nowrap;box-shadow:var(--shadow-md)}
.toast.show{opacity:1}

/* Page panels */
.page{display:none}
.page.active{display:block}

/* Section collapse */
.section-collapse{border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;margin-top:16px;background:var(--surface);box-shadow:var(--shadow)}
.section-collapse-hdr{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;cursor:pointer;user-select:none;background:var(--surface2)}
.section-collapse-hdr:hover{background:#ECEAE6}
.section-collapse-hdr span{font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px;color:var(--text2)}
.section-collapse-body{padding:16px;display:none}
.section-collapse-body.open{display:block}

/* Excel week row */
.excel-week-row{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.excel-week-row .week-label{font-size:13px;font-weight:600;flex:1;text-align:center}

@media(max-width:768px){
  .sidebar{display:none}
  .main{margin-left:0}
  .stat-grid{grid-template-columns:repeat(3,1fr)}
  .day-tabs{grid-template-columns:repeat(5,1fr)}
}
</style>
</head>
<body>
<div class="app-shell">
<!-- Sidebar -->
<aside class="sidebar">
  <div class="sidebar-logo">
    <h1>보드 발주 시스템<span class="sidebar-badge">관리자</span></h1>
    <p>보드 주간 발주 관리</p>
  </div>
  <nav class="sidebar-nav">
    <div class="nav-section">메뉴</div>
    <button class="nav-item active" onclick="goPage('order')"><i class="ti ti-clipboard-list"></i>오더 입력</button>
    <button class="nav-item" onclick="goPage('summary')"><i class="ti ti-table"></i>주간 현황</button>
    <button class="nav-item" onclick="goPage('mail')"><i class="ti ti-mail"></i>메일 발송</button>
    <button class="nav-item" onclick="goPage('settings')"><i class="ti ti-settings"></i>설정</button>
  </nav>
  <div class="sidebar-footer">
    <div class="company-link-box">
      <p><i class="ti ti-link" style="font-size:11px"></i> 업체 공유 링크</p>
      <input id="company-url" value="" readonly onclick="this.select()">
      <div class="company-link-btn">
        <button onclick="copyCompanyUrl()">링크 복사</button>
        <button class="sec" onclick="openCompanyPage()">미리보기</button>
      </div>
    </div>
  </div>
</aside>

<!-- Main -->
<div class="main">
  <header class="topbar">
    <span class="topbar-title" id="page-title">오더 입력</span>
    <div class="topbar-right">
      <div class="week-nav" id="week-nav-main">
        <button onclick="changeWeek(-1)">← 이전</button>
        <span class="week-label" id="week-label-main"></span>
        <span class="week-badge" id="week-badge-main">이번 주</span>
        <button onclick="changeWeek(1)">다음 →</button>
      </div>
    </div>
  </header>

  <div class="content">

    <!-- ORDER PAGE -->
    <div class="page active" id="page-order">
      <div class="day-tabs" id="day-tabs"></div>
      <div class="company-row" id="company-select"></div>
      <div id="order-form-area"><div class="empty"><i class="ti ti-arrow-up"></i>요일과 업체를 선택하세요</div></div>
      <!-- Board manage -->
      <div class="section-collapse">
        <div class="section-collapse-hdr" onclick="toggleSection('board')">
          <span><i class="ti ti-adjustments-horizontal"></i>품목 관리</span>
          <i class="ti ti-chevron-down chevron" id="chev-board"></i>
        </div>
        <div class="section-collapse-body" id="body-board">
          <table class="board-table" id="board-list-table"></table>
          <div class="add-row" style="flex-wrap:wrap;gap:6px;margin-top:8px">
            <input id="bm-type" placeholder="구분 (MDF/PB…)" style="flex:1;min-width:100px">
            <input id="bm-material" placeholder="자재 (예: 2.7)" style="flex:1;min-width:80px">
            <input id="bm-size" placeholder="사이즈 (예: 4*8)" style="flex:1;min-width:80px">
            <button class="btn btn-secondary btn-sm" onclick="addBoardInline()"><i class="ti ti-plus"></i>추가</button>
          </div>
        </div>
      </div>
    </div>

    <!-- SUMMARY PAGE -->
    <div class="page" id="page-summary">
      <div class="week-nav" style="justify-content:center;margin-bottom:16px">
        <button onclick="changeSummaryWeek(-1)">← 이전</button>
        <span class="week-label" id="summary-week-label" style="min-width:180px;text-align:center"></span>
        <button onclick="changeSummaryWeek(1)">다음 →</button>
      </div>
      <div class="stat-grid" id="summary-stats"></div>
      <div id="summary-content"></div>
      <!-- Excel download -->
      <div class="section-collapse">
        <div class="section-collapse-hdr" onclick="toggleSection('excel')">
          <span><i class="ti ti-file-spreadsheet"></i>엑셀 양식 업로드 후 다운로드</span>
          <i class="ti ti-chevron-down chevron" id="chev-excel"></i>
        </div>
        <div class="section-collapse-body" id="body-excel">
          <p style="font-size:12px;color:var(--text3);margin-bottom:12px">발주 양식(.xlsx)을 업로드하면 해당 주간 오더가 자동 기재된 파일로 다운로드됩니다. 양식이 없으면 기본 형식으로 다운로드됩니다.</p>
          <div id="upload-zone" class="upload-zone" onclick="document.getElementById('file-input').click()" ondragover="event.preventDefault();this.classList.add('drag')" ondragleave="this.classList.remove('drag')" ondrop="handleDrop(event)">
            <i class="ti ti-upload"></i>
            <p>클릭하거나 파일을 드래그하여 업로드<br><span style="font-size:11px;color:var(--text3)">.xlsx 발주 양식 파일</span></p>
          </div>
          <input type="file" id="file-input" accept=".xlsx" style="display:none" onchange="handleFileSelect(event)">
          <div id="file-info" class="file-info" style="display:none">
            <i class="ti ti-file-spreadsheet"></i>
            <span class="fname" id="file-name"></span>
            <button onclick="removeFile()">×</button>
          </div>
          <div class="excel-week-row">
            <button class="btn btn-secondary btn-sm" onclick="changeExcelWeek(-1)">← 이전</button>
            <span class="week-label" id="excel-week-label"></span>
            <button class="btn btn-secondary btn-sm" onclick="changeExcelWeek(1)">다음 →</button>
          </div>
          <div style="display:flex;gap:8px;flex-wrap:wrap">
            <button class="btn btn-green" onclick="downloadExcel()"><i class="ti ti-download"></i>엑셀 다운로드</button>
          </div>
        </div>
      </div>
    </div>

    <!-- MAIL PAGE -->
    <div class="page" id="page-mail">
      <div class="week-nav" style="margin-bottom:16px">
        <button onclick="changeMailWeek(-1)">← 이전</button>
        <span class="week-label" id="mail-week-label" style="min-width:180px;text-align:center"></span>
        <button onclick="changeMailWeek(1)">다음 →</button>
      </div>
      <div style="display:grid;gap:14px;max-width:700px">

        <div class="settings-card">
          <h3><i class="ti ti-mail"></i>수신 이메일</h3>
          <input id="mail-to" style="width:100%;padding:8px 12px;border:1px solid var(--border);border-radius:var(--radius);font-size:13px;font-family:inherit" placeholder="운송사 이메일 주소">
        </div>
        <div class="settings-card">
          <h3><i class="ti ti-file-text"></i>메일 미리보기</h3>
          <div class="mail-preview" id="mail-preview"></div>
          <div style="display:flex;gap:8px">
            <button class="btn btn-primary" onclick="sendMail()"><i class="ti ti-send"></i>메일 발송</button>
            <button class="btn btn-secondary" onclick="copyMail()"><i class="ti ti-copy"></i>내용 복사</button>
          </div>
        </div>
      </div>
    </div>

    <!-- SETTINGS PAGE -->
    <div class="page" id="page-settings">
      <div style="max-width:600px;display:grid;gap:14px">
        <div class="settings-card">
          <h3><i class="ti ti-building"></i>업체 관리</h3>
          <div class="tags" id="company-tags"></div>
          <div class="add-row"><input id="new-company" placeholder="업체명 입력"><button class="btn btn-secondary btn-sm" onclick="addCompany()"><i class="ti ti-plus"></i>추가</button></div>
        </div>
        <div class="settings-card">
          <h3><i class="ti ti-truck"></i>운송사 관리</h3>
          <div class="tags" id="carrier-tags"></div>
          <div class="add-row"><input id="new-carrier" placeholder="운송사명 입력"><button class="btn btn-secondary btn-sm" onclick="addCarrier()"><i class="ti ti-plus"></i>추가</button></div>
        </div>
        <div class="settings-card">
          <h3><i class="ti ti-layers"></i>MFC 품목 노출 업체</h3>
          <p style="font-size:12px;color:var(--text3);margin-bottom:8px">체크된 업체에서만 MFC 품목이 표시됩니다.</p>
          <div class="mfc-grid" id="mfc-company-grid"></div>
        </div>
        <div class="settings-card">
          <h3><i class="ti ti-mail"></i>발신 설정</h3>
          <div style="display:grid;gap:8px">
            <div style="display:flex;align-items:center;gap:10px"><label style="font-size:13px;min-width:80px;color:var(--text2)">발신자명</label><input id="sender-name" style="flex:1;padding:7px 10px;border:1px solid var(--border);border-radius:var(--radius);font-size:13px;font-family:inherit"></div>
            <div style="display:flex;align-items:center;gap:10px"><label style="font-size:13px;min-width:80px;color:var(--text2)">메일 제목</label><input id="mail-subject" style="flex:1;padding:7px 10px;border:1px solid var(--border);border-radius:var(--radius);font-size:13px;font-family:inherit"></div>
          </div>
          <button class="btn btn-primary btn-sm" style="margin-top:12px" onclick="saveSettings()"><i class="ti ti-check"></i>저장</button>
        </div>
      </div>
    </div>

  </div><!-- content -->
</div><!-- main -->
</div><!-- app-shell -->

<div class="toast" id="toast"></div>

<script>
// ─── State ───
const DAYS_KO=['일','월','화','수','목','금','토'];
const ROW_STYLE={'MDF':'','PB':'','MFC (WW)':'row-mfc-ww','MFC (IV)':'row-mfc-iv'};
const MFC_TYPES=['MFC (WW)','MFC (IV)'];
let sections={board:false,excel:false};
let openCards={};
let uploadedFileData=null;

const KEY='boardOrderState_v1';
let state=loadState();

function defaultState(){return{
  companies:['부림','목림','프린테크','메닉스','충주공장','진산(삼죽)','동방','혜윰','태종산업'],
  carriers:['부림운송','목림운송'],
  mfcAllowed:['충주공장'],
  boards:[
    {type:'MDF',material:'2.7',size:'4*8',warehouse:'해성'},{type:'MDF',material:'2.7',size:'4*6',warehouse:'해성'},
    {type:'MDF',material:'4.5',size:'4*8',warehouse:'우인'},{type:'MDF',material:'4.5',size:'4*7',warehouse:'우인'},
    {type:'PB',material:'12',size:'4*8',warehouse:'해성'},{type:'PB',material:'15',size:'4*6',warehouse:'우인'},
    {type:'PB',material:'15',size:'4*8',warehouse:'우인'},{type:'PB',material:'15',size:'6*8',warehouse:'해성'},
    {type:'PB',material:'18',size:'4*6',warehouse:'해성'},{type:'PB',material:'18',size:'4*8',warehouse:'우인'},
    {type:'PB',material:'18',size:'6*8',warehouse:'해성'},{type:'PB',material:'22',size:'4*6',warehouse:'해성'},
    {type:'PB',material:'22',size:'4*8',warehouse:'해성'},{type:'PB',material:'22',size:'6*8',warehouse:'해성'},
    {type:'PB',material:'28',size:'4*8',warehouse:'해성'},{type:'PB',material:'28',size:'4*5.3',warehouse:'해성'},
    {type:'PB',material:'28',size:'6*8',warehouse:'해성'},
    {type:'MFC (WW)',material:'15',size:'4*8',warehouse:'해성'},{type:'MFC (WW)',material:'18',size:'4*8',warehouse:'해성'},
    {type:'MFC (WW)',material:'22',size:'4*8',warehouse:'해성'},{type:'MFC (WW)',material:'28',size:'4*8',warehouse:'해성'},
    {type:'MFC (IV)',material:'15',size:'4*8',warehouse:'해성'},{type:'MFC (IV)',material:'18',size:'4*8',warehouse:'해성'},
    {type:'MFC (IV)',material:'22',size:'4*8',warehouse:'해성'},
  ],
  orders:{},selectedDay:null,selectedCompany:null,
  weekOffset:0,summaryWeekOffset:0,mailWeekOffset:0,excelWeekOffset:0,
  selectedCarrier:null,senderName:'담당자',mailSubject:'[보드발주] {주간} 배차 요청'
};}

function loadState(){
  try{
    const s=localStorage.getItem(KEY);
    if(!s) return defaultState();
    const parsed=JSON.parse(s);
    const def=defaultState();
    // companies/boards가 없거나 비어있으면 기본값으로 보완
    if(!parsed.companies||parsed.companies.length===0) parsed.companies=def.companies;
    if(!parsed.boards||parsed.boards.length===0) parsed.boards=def.boards;
    if(!parsed.carriers||parsed.carriers.length===0) parsed.carriers=def.carriers;
    if(!parsed.mfcAllowed) parsed.mfcAllowed=def.mfcAllowed;
    if(!parsed.orders) parsed.orders={};
    return parsed;
  }catch{return defaultState();}
}
function resetToDefault(){
  if(!confirm('설정을 초기화할까요? 오더 데이터는 유지됩니다.')) return;
  const orders=state.orders;
  state=defaultState();
  state.orders=orders;
  saveState();
  location.reload();
}
function saveState(){
  try{localStorage.setItem(KEY,JSON.stringify(state));}catch{}
  // Firebase 실시간 동기화 (관리자 저장시에만 전체 state 업로드)
  if(window.fbReady && window.fbSave){
    window.fbSave({orders: state.orders});
  }
}

// ─── Helpers ───
function isMfcAllowed(c){return state.mfcAllowed.includes(c);}
function visibleBoards(c){
  if(isMfcAllowed(c))return state.boards.map((b,i)=>({b,i}));
  return state.boards.map((b,i)=>({b,i})).filter(({b})=>!MFC_TYPES.includes(b.type));
}
function getMonday(offset=0){
  const now=new Date(),day=now.getDay();
  const diff=now.getDate()-day+(day===0?-6:1)+offset*7;
  const mon=new Date(now);mon.setDate(diff);mon.setHours(0,0,0,0);return mon;
}
function getWeekDays(offset=0){const mon=getMonday(offset);return Array.from({length:5},(_,i)=>{const d=new Date(mon);d.setDate(mon.getDate()+i);return d;});}
function fmtDate(d){return `${d.getMonth()+1}/${d.getDate()}`}
function fmtFull(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function fmtWeekRange(offset=0){const d=getWeekDays(offset);return `${d[0].getMonth()+1}월 ${d[0].getDate()}일 ~ ${d[4].getMonth()+1}월 ${d[4].getDate()}일`}
function orderKey(ds,c){return `${ds}::${c}`}
function fmtQty(val){if(!val)return '';const t=String(val).trim();return /^\d+(\.\d+)?$/.test(t)?t+'CT':t;}
function hasRealItem(it){return it&&it.qty&&String(it.qty).trim()!==''&&it.qty!=='0';}
function companyHasOrderOnDay(company,ds){
  if(!company)return false;
  const ord=state.orders[orderKey(ds,company)];if(!ord)return false;
  return Object.values(ord.items).some(it=>hasRealItem(it))||(ord.note&&ord.note.trim()!=='');
}

// ─── Week ───
function renderWeekLabel(){
  const w=state.weekOffset;
  document.getElementById('week-label-main').textContent=fmtWeekRange(w);
  document.getElementById('week-badge-main').textContent=w===0?'이번 주':w>0?`+${w}주`:`${w}주`;
}
function changeWeek(dir){state.weekOffset+=dir;state.selectedDay=null;saveState();renderWeekLabel();renderDayTabs();renderOrderForm();}
function changeSummaryWeek(dir){state.summaryWeekOffset+=dir;saveState();renderSummary();}
function changeMailWeek(dir){state.mailWeekOffset+=dir;saveState();renderMail();}
function changeExcelWeek(dir){state.excelWeekOffset+=dir;saveState();document.getElementById('excel-week-label').textContent=fmtWeekRange(state.excelWeekOffset);}

// ─── Navigation ───
function goPage(name){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  document.getElementById('page-'+name).classList.add('active');
  document.querySelector(`.nav-item[onclick="goPage('${name}')"]`).classList.add('active');
  const titles={order:'오더 입력',summary:'주간 현황',mail:'메일 발송',settings:'설정'};
  document.getElementById('page-title').textContent=titles[name];
  const showWeekNav=['order'];
  document.getElementById('week-nav-main').style.display=showWeekNav.includes(name)?'flex':'none';
  if(name==='summary')renderSummary();
  if(name==='mail')renderMail();
  if(name==='settings')renderSettings();
}

// ─── Company URL ───
function getCompanyUrl(){
  const base=location.href.replace('index.html','').replace(/\/$/,'');
  return `${base}/company.html`;
}
function copyCompanyUrl(){
  navigator.clipboard.writeText(getCompanyUrl()).then(()=>showToast('링크가 복사됐습니다'));
}
function openCompanyPage(){window.open('company.html','_blank');}

// ─── Day Tabs ───
function renderDayTabs(){
  renderWeekLabel();
  const days=getWeekDays(state.weekOffset);
  document.getElementById('day-tabs').innerHTML=days.map(d=>{
    const ds=fmtFull(d),isActive=state.selectedDay===ds;
    const hasOrder=companyHasOrderOnDay(state.selectedCompany,ds);
    const ddateStyle=hasOrder?'background:#FFF176;border-radius:4px;padding:2px 6px':'';
    return `<div class="day-tab${isActive?' active':''}" onclick="selectDay('${ds}')">
      <div class="dow">${DAYS_KO[d.getDay()]}요일</div>
      <div class="ddate" style="${ddateStyle}">${fmtDate(d)}</div>
      ${hasOrder?'<div class="dot"></div>':'<div class="dot-empty"></div>'}
    </div>`;
  }).join('');
}
let adminTempOrder={items:{},note:undefined};
function resetAdminTemp(){adminTempOrder={items:{},note:undefined};}
function selectDay(ds){state.selectedDay=ds;resetAdminTemp();saveState();renderDayTabs();renderOrderForm();}

// ─── Company Select ───
function renderCompanySelect(){
  document.getElementById('company-select').innerHTML=state.companies.map(c=>
    `<button class="company-btn ${state.selectedCompany===c?'selected':''}" onclick="selectCompany('${c}')">${c}</button>`
  ).join('');
}
function selectCompany(c){state.selectedCompany=c;resetAdminTemp();saveState();renderCompanySelect();renderDayTabs();renderOrderForm();}

// ─── Order Form ───
function renderOrderForm(){
  const el=document.getElementById('order-form-area');
  if(!state.selectedDay||!state.selectedCompany){
    el.innerHTML=`<div class="empty"><i class="ti ti-arrow-up"></i><p>${!state.selectedDay?'요일을 선택하세요':'업체를 선택하세요'}</p></div>`;return;
  }
  const ds=state.selectedDay,key=orderKey(ds,state.selectedCompany);
  if(!state.orders[key])state.orders[key]={items:{},note:''};
  const baseOrd=state.orders[key];
  const ord={items:Object.assign({},JSON.parse(JSON.stringify(baseOrd.items)),adminTempOrder.items),note:adminTempOrder.note!==undefined?adminTempOrder.note:baseOrd.note};
  const d=new Date(ds);
  const filtered=visibleBoards(state.selectedCompany);
  let rows='',lastType=null;
  filtered.forEach(({b,i})=>{
    const base=ROW_STYLE[b.type]||'',gs=b.type!==lastType&&base?'group-start':'';lastType=b.type;
    const it=ord.items[i]||{qty:'',flag:''},flag=it.flag||'';
    const flagCls=flag==='cancel'?'row-cancel':flag==='add'?'row-add':'';
    const cls=[base,gs,flagCls].filter(Boolean).join(' ');
    rows+=`<tr class="${cls}">
      <td>${b.type}</td><td>${b.material}</td><td>${b.size}</td>
      <td><span class="wh-cell" id="wh-${i}" onclick="editWh(${i})"><span>${b.warehouse||'—'}</span><i class="ti ti-pencil"></i></span></td>
      <td><input class="qty-input" type="text" value="${it.qty||''}" placeholder="-" oninput="setQty(${i},this.value)" onfocus="this.select()"></td>
      <td><div class="flag-cell">
        <button class="flag-btn cancel ${flag==='cancel'?'active':''}" onclick="toggleFlag(${i},'cancel')">취소</button>
        <button class="flag-btn add ${flag==='add'?'active':''}" onclick="toggleFlag(${i},'add')">추가</button>
      </div></td>
    </tr>`;
  });
  el.innerHTML=`<div class="order-card">
    <div class="order-card-header">
      <h3>${d.getMonth()+1}월 ${d.getDate()}일 (${DAYS_KO[d.getDay()]}) · ${state.selectedCompany}</h3>
      <button class="btn btn-danger btn-sm" onclick="clearDay()"><i class="ti ti-trash"></i>초기화</button>
    </div>
    <table class="order-table">
      <thead><tr><th>구분</th><th>자재</th><th>사이즈</th><th>창고</th><th>수량 (기본 1CT / 예외시 별도기재)</th><th>변경 <span style="font-weight:400;font-size:10px">취소=-1 / 추가=+1</span></th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
    <div class="note-row">
      <label style="font-size:12px;color:var(--text3);white-space:nowrap">특이사항</label>
      <input class="note-input" type="text" value="${ord.note||''}" placeholder="특이사항 입력" oninput="setNote(this.value)">
    </div>
    <div class="btn-row">
      <button class="btn btn-primary" onclick="saveOrder()"><i class="ti ti-check"></i>저장</button>
    </div>
  </div>`;
}

function setQty(idx,val){
  if(!adminTempOrder.items[idx])adminTempOrder.items[idx]={qty:'',flag:''};
  adminTempOrder.items[idx].qty=String(val).trim();
}
function setNote(val){
  adminTempOrder.note=val;
}
function toggleFlag(idx,flag){
  if(!adminTempOrder.items[idx])adminTempOrder.items[idx]={qty:'',flag:''};
  const item=adminTempOrder.items[idx];
  if(item.flag===flag){item.flag='';}
  else{item.flag=flag;if(flag==='cancel'){const n=parseFloat(item.qty)||0;item.qty=String(n-1);}else if(flag==='add'){const n=parseFloat(item.qty)||0;item.qty=String(n+1);}}
  renderOrderForm();
}
function editWh(idx){
  const cell=document.getElementById('wh-'+idx);if(!cell)return;
  const cur=state.boards[idx].warehouse;
  cell.outerHTML=`<span id="wh-${idx}"><input class="wh-input" value="${cur}" onblur="saveWh(${idx},this.value)" onkeydown="if(event.key==='Enter')this.blur();if(event.key==='Escape'){this.value='${cur}';this.blur();}" autofocus></span>`;
  document.querySelector(`#wh-${idx} input`).select();
}
function saveWh(idx,val){
  state.boards[idx].warehouse=val.trim();saveState();
  const cell=document.getElementById('wh-'+idx);if(!cell)return;
  const v=state.boards[idx].warehouse||'—';
  cell.outerHTML=`<span class="wh-cell" id="wh-${idx}" onclick="editWh(${idx})"><span>${v}</span><i class="ti ti-pencil"></i></span>`;
}
function clearDay(){delete state.orders[orderKey(state.selectedDay,state.selectedCompany)];resetAdminTemp();saveState();renderOrderForm();renderDayTabs();showToast('초기화됐습니다');}
function saveOrder(){
  if(document.activeElement)document.activeElement.blur();
  const noteEl=document.querySelector('.note-input');
  if(noteEl)adminTempOrder.note=noteEl.value;
  const key=orderKey(state.selectedDay,state.selectedCompany);
  if(!state.orders[key])state.orders[key]={items:{},note:''};
  Object.entries(adminTempOrder.items).forEach(([idx,val])=>{
    if(!state.orders[key].items[idx])state.orders[key].items[idx]={qty:'',flag:''};
    if(val.qty!==undefined)state.orders[key].items[idx].qty=val.qty;
    if(val.flag!==undefined)state.orders[key].items[idx].flag=val.flag;
  });
  if(adminTempOrder.note!==undefined)state.orders[key].note=adminTempOrder.note;
  resetAdminTemp();
  saveState();
  renderOrderForm();
  renderDayTabs();
  showToast('저장됐습니다');
}

// ─── Summary ───
function renderSummary(){
  const days=getWeekDays(state.summaryWeekOffset);
  document.getElementById('summary-week-label').textContent=fmtWeekRange(state.summaryWeekOffset);
  let tc=new Set(),ti=0,td=new Set();
  state.companies.forEach(c=>{days.forEach(d=>{
    const key=orderKey(fmtFull(d),c),ord=state.orders[key];if(!ord)return;
    const items=Object.entries(ord.items).filter(([,it])=>hasRealItem(it));
    if(!items.length&&!ord.note)return;tc.add(c);td.add(fmtFull(d));ti+=items.length;
  });});
  document.getElementById('summary-stats').innerHTML=`
    <div class="stat-card"><div class="num">${tc.size}</div><div class="lbl">업체</div></div>
    <div class="stat-card"><div class="num">${(()=>{let cnt=0;state.companies.forEach(c=>{days.forEach(d=>{const key=orderKey(fmtFull(d),c),ord=state.orders[key];if(!ord)return;cnt+=Object.values(ord.items).filter(it=>it&&it.flag).length;});});return cnt;})()}</div><div class="lbl">변경 건수</div></div>
    <div class="stat-card"><div class="num">${ti}</div><div class="lbl">품목 건수</div></div>`;
  const el=document.getElementById('summary-content');
  let hasAny=false,html='';
  state.companies.forEach(c=>{
    let cd=[];
    days.forEach(d=>{
      const ds=fmtFull(d),key=orderKey(ds,c),ord=state.orders[key];if(!ord)return;
      const items=Object.entries(ord.items).filter(([,it])=>hasRealItem(it));
      if(!items.length&&!ord.note)return;cd.push({d,ds,items,note:ord.note||''});
    });
    if(!cd.length)return;hasAny=true;
    const isOpen=openCards[c]!==false,cardId='card-'+c.replace(/[^a-zA-Z0-9]/g,'_');
    let body='';
    cd.forEach((x,idx)=>{
      if(idx>0)body+=`<div class="day-divider"></div>`;
      const norm=x.items.filter(([,it])=>!it.flag),chg=x.items.filter(([,it])=>it.flag);
      body+=`<div class="day-group"><div class="day-group-hdr"><i class="ti ti-calendar" style="font-size:12px"></i>${x.d.getMonth()+1}월 ${x.d.getDate()}일 (${DAYS_KO[x.d.getDay()]})<span style="background:var(--blue-light);color:var(--blue);font-size:11px;font-weight:600;padding:1px 7px;border-radius:20px;margin-left:4px">${norm.length}건</span>${chg.length?`<span style="font-size:11px;color:var(--red);font-weight:600">변경 ${chg.length}건</span>`:''}</div>`;
      if(norm.length){body+=`<div class="pills">`;norm.forEach(([i,it])=>{const b=state.boards[i];if(!b)return;body+=`<span class="pill">${b.type} ${b.material} ${b.size}<span class="qty">${fmtQty(it.qty)}</span></span>`;});body+=`</div>`;}
      if(chg.length){body+=`<div class="change-section"><div class="change-label"><i class="ti ti-refresh" style="font-size:11px"></i>변경 요청</div><div class="pills">`;chg.forEach(([i,it])=>{const b=state.boards[i];if(!b)return;const isCan=it.flag==='cancel';body+=`<span class="pill ${isCan?'is-cancel':'is-add'}">${b.type} ${b.material} ${b.size}<span class="qty">${fmtQty(it.qty)}</span><span class="pill-tag ${isCan?'cancel':'add'}">${isCan?'취소':'추가'}</span></span>`;});body+=`</div></div>`;}
      if(x.note)body+=`<div style="margin-top:6px"><span class="note-pill">※ ${x.note}</span></div>`;
      body+=`</div>`;
    });
    html+=`<div class="company-card"><div class="company-card-hdr" onclick="toggleCard('${c}','${cardId}')"><span class="name">${c}</span><i class="ti ti-chevron-down chevron ${isOpen?'open':''}" id="chev-${cardId}"></i></div><div class="company-card-body ${isOpen?'open':''}" id="${cardId}">${body}</div></div>`;
  });
  el.innerHTML=hasAny?html:`<div class="empty"><i class="ti ti-calendar-off"></i><p>이 주간에 입력된 오더가 없습니다</p></div>`;
}

function renderMail(){
  const days=getWeekDays(state.mailWeekOffset);
  document.getElementById('mail-week-label').textContent=fmtWeekRange(state.mailWeekOffset);
  const weekStr=fmtWeekRange(state.mailWeekOffset);
  let body=`안녕하세요.\n${state.senderName}입니다.\n\n${weekStr} 배차 요청 드립니다.\n\n`;
  days.forEach(d=>{
    const ds=fmtFull(d);
    const dayName=`* ${DAYS_KO[d.getDay()]}요일 (${d.getMonth()+1}/${d.getDate()})`;
    let dayBlock='';let hasAny=false;
    state.companies.forEach(c=>{
      const key=orderKey(ds,c),ord=state.orders[key];if(!ord)return;
      const items=Object.entries(ord.items).filter(([,it])=>hasRealItem(it));
      if(!items.length&&!ord.note)return;hasAny=true;
      const norm=items.filter(([,it])=>!it.flag),chg=items.filter(([,it])=>it.flag);
      dayBlock+=`- ${c}\n`;
      norm.forEach(([i,it])=>{const b=state.boards[i];if(b)dayBlock+=`  ${b.type} ${b.material}T ${b.size} - ${fmtQty(it.qty)}\n`;});
      if(chg.length){chg.forEach(([i,it])=>{const b=state.boards[i];if(b)dayBlock+=`  ${b.type} ${b.material}T ${b.size} - ${fmtQty(it.qty)}(${it.flag==='cancel'?'취소':'추가'})\n`;});}
      if(ord.note)dayBlock+=`  ※ ${ord.note}\n`;
    });
    if(hasAny){body+=`${dayName}\n${dayBlock}\n`;}
    else{body+=`${dayName} - 출고요청 없음\n\n`;}
  });
  body+=`감사합니다.\n${state.senderName} 드림`;
  document.getElementById('mail-preview').textContent=body;
}

function generateTemplate(){
  const days=getWeekDays(state.excelWeekOffset);
  const weekStr=fmtWeekRange(state.excelWeekOffset);

  // 날짜별 오더 있는 업체 수집
  const dayCompanies=[];
  days.forEach(d=>{
    const ds=fmtFull(d);
    const companies=state.companies.filter(c=>{
      const key=orderKey(ds,c),ord=state.orders[key];if(!ord)return false;
      return Object.values(ord.items).some(it=>hasRealItem(it))||(ord.note&&ord.note.trim()!=='');
    });
    if(companies.length>0)dayCompanies.push({d,ds,companies});
  });
  if(!dayCompanies.length){showToast('이 주간에 오더가 없습니다');return;}

  // 색상 스타일 (원본 양식과 동일한 theme color)
  const S_HEADER={patternType:'solid',fgColor:{theme:9,tint:0.79998168889431442}};
  const S_DARK  ={patternType:'solid',fgColor:{theme:0,tint:-0.14999847407452621}};
  const S_WW    ={patternType:'solid',fgColor:{theme:7,tint:0.79998168889431442}};
  const S_IV    ={patternType:'solid',fgColor:{theme:4,tint:0.59999389629810485}};
  const S_NONE  ={patternType:'none'};
  const BD={style:'thin',color:{rgb:'000000'}};
  const BORDER={top:BD,bottom:BD,left:BD,right:BD};
  const FONT={name:'맑은 고딕',sz:10};
  const FONTB={name:'맑은 고딕',sz:10,bold:true};
  const CENTER={horizontal:'center',vertical:'center',wrapText:true};

  function rowFill(btype,idx){
    if(btype==='MFC (WW)')return S_WW;
    if(btype==='MFC (IV)')return S_IV;
    return idx%2===1?S_DARK:S_NONE;
  }
  function cs(v,fill,font,bold){
    const f=bold?FONTB:font||FONT;
    const t=typeof v==='number'?'n':(v instanceof Date?'n':'s');
    const cell={s:{fill:fill||S_NONE,font:f,alignment:CENTER,border:BORDER}};
    if(v!==null&&v!==undefined){cell.v=v;cell.t=t;}
    else{cell.v='';cell.t='s';}
    return cell;
  }

  const ws={};
  const merges=[];
  const cols=[];
  let maxC=0;

  function setC(r,c,v,fill,bold,nf){
    const addr=XLSX.utils.encode_cell({r,c});
    ws[addr]=cs(v,fill,FONT,bold);
    if(nf)ws[addr].z=nf;
    if(c>=maxC)maxC=c+1;
  }

  // Row1: 빈행
  // Row2(idx=1), Row3(idx=2): 헤더
  // 고정 A~F 병합 (row2~3)
  const fixedLabels=['구분','자재','사이즈','창고','B/L','창고'];
  const fixedWidths=[11.16,8.58,8.0,8.0,9.0,9.0];
  fixedLabels.forEach((label,i)=>{
    setC(1,i,label,S_HEADER,true);
    setC(2,i,null,S_HEADER,true);
    merges.push({s:{r:1,c:i},e:{r:2,c:i}});
    cols[i]={wch:fixedWidths[i]};
  });

  // 날짜 그룹 (col6부터)
  let curC=6;
  const compColMap={};

  dayCompanies.forEach(({d,ds,companies})=>{
    const n=companies.length;
    // 날짜를 Excel serial number로 변환
    const excelDate=Math.round((d.getTime()-new Date(Date.UTC(1899,11,30)).getTime())/86400000);

    // Row2: 날짜 (n컬럼 병합)
    setC(1,curC,excelDate,S_HEADER,true,'YYYY-MM-DD');
    for(let i=1;i<n;i++)setC(1,curC+i,null,S_HEADER,false);
    if(n>1)merges.push({s:{r:1,c:curC},e:{r:1,c:curC+n-1}});

    // Row3: 업체명
    companies.forEach((company,i)=>{
      const col=curC+i;
      setC(2,col,company,S_HEADER,true);
      compColMap[ds+'::'+company]=col;
      cols[col]={wch:9};
    });
    curC+=n;

    // B/L (row2~3 병합)
    setC(1,curC,'B/L',S_HEADER,true);
    setC(2,curC,null,S_HEADER,false);
    merges.push({s:{r:1,c:curC},e:{r:2,c:curC}});
    cols[curC]={wch:9};
    curC++;

    // 창고 (row2~3 병합)
    setC(1,curC,'창고',S_HEADER,true);
    setC(2,curC,null,S_HEADER,false);
    merges.push({s:{r:1,c:curC},e:{r:2,c:curC}});
    cols[curC]={wch:9};
    curC++;
  });

  const totalCols=curC;

  // 품목 행 (row4부터 = idx 3부터)
  const typeIdx={};
  state.boards.forEach((board,bidx)=>{
    typeIdx[board.type]=(typeIdx[board.type]||0);
    const fill=rowFill(board.type,typeIdx[board.type]);
    typeIdx[board.type]++;
    const r=3+bidx;
    // A~F
    [board.type,board.material,board.size,board.warehouse,null,null].forEach((v,i)=>{
      setC(r,i,v,fill,false);
    });
    // 업체 수량 빈칸
    for(let c=6;c<totalCols;c++) setC(r,c,null,fill,false);
  });

  // 오더 수량 기재
  days.forEach(d=>{
    const ds=fmtFull(d);
    state.companies.forEach(company=>{
      const col=compColMap[ds+'::'+company];
      if(col===undefined)return;
      const key=orderKey(ds,company);
      const ord=state.orders[key];if(!ord)return;
      state.boards.forEach((board,bidx)=>{
        const item=ord.items[bidx];if(!hasRealItem(item))return;
        const r=3+bidx;
        const q=String(item.qty).trim();
        const num=parseFloat(q);
        const addr=XLSX.utils.encode_cell({r,c:col});
        const existStyle=ws[addr]?ws[addr].s:null;
        ws[addr]={
          v:isNaN(num)?q:num,
          t:isNaN(num)?'s':'n',
          s:existStyle||{fill:S_NONE,font:FONT,alignment:CENTER,border:BORDER}
        };
      });
    });
  });

  // 워크시트 완성
  ws['!ref']=XLSX.utils.encode_range({s:{r:0,c:0},e:{r:3+state.boards.length-1,c:totalCols-1}});
  ws['!merges']=merges;
  ws['!cols']=cols;
  ws['!rows']=[{hpt:17.5},{hpt:25},{hpt:18}];

  const wb2=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb2,ws,'Sheet1');
  XLSX.writeFile(wb2,`보드발주_양식_${weekStr}.xlsx`,{cellStyles:true});
  showToast('양식이 자동 생성됐습니다!');
}

  }).catch(()=>{
    // 클립보드 실패시 텍스트 영역으로

function matchCompany(xlsComp, stateCompanies){
  if(stateCompanies.includes(xlsComp))return xlsComp;
  const lower=xlsComp.toLowerCase().replace(/\s/g,'');
  return stateCompanies.find(c=>{
    const cl=c.toLowerCase().replace(/\s/g,'');
    return cl===lower||cl.includes(lower)||lower.includes(cl);
  })||null;
}

function downloadExcel(){
  const days=getWeekDays(state.excelWeekOffset);
  const weekStr=fmtWeekRange(state.excelWeekOffset);

  if(!uploadedFileData){
    // 기본 형식 다운로드
    const rows=[['날짜','요일','업체','구분','자재','사이즈','창고','수량','변경']];
    let hasData=false;
    days.forEach(d=>{
      const ds=fmtFull(d);
      state.companies.forEach(c=>{
        const key=orderKey(ds,c),ord=state.orders[key];if(!ord)return;
        Object.entries(ord.items).forEach(([i,it])=>{
          if(!hasRealItem(it))return;
          const b=state.boards[i];if(!b)return;hasData=true;
          rows.push([ds,DAYS_KO[d.getDay()]+'요일',c,b.type,b.material,b.size,b.warehouse,fmtQty(it.qty),it.flag==='cancel'?'취소':it.flag==='add'?'추가':'']);
        });
      });
    });
    if(!hasData){showToast('이 주간에 입력된 오더가 없습니다');return;}
    const wb=XLSX.utils.book_new();
    const ws=XLSX.utils.aoa_to_sheet(rows);
    ws['!cols']=[{wch:14},{wch:8},{wch:12},{wch:12},{wch:8},{wch:8},{wch:8},{wch:8},{wch:6}];
    XLSX.utils.book_append_sheet(wb,ws,'보드발주');
    XLSX.writeFile(wb,`보드발주_${weekStr}.xlsx`);
    showToast('기본 형식으로 다운로드됐습니다');
    return;
  }

  // ── 업로드된 양식에 수량 기재 ──
  try{
    const wb=XLSX.read(uploadedFileData,{type:'array',cellDates:true});
    const ws=wb.Sheets[wb.SheetNames[0]];
    const range=XLSX.utils.decode_range(ws['!ref']);

    // 1. 병합 셀 기반으로 날짜 그룹 파악 (날짜가 공란이어도 OK)
    // 행2(r=1)의 가로 병합 셀 중 H열(col7) 이후 = 날짜 그룹
    const merges = ws['!merges'] || [];
    const dateGroupCols = []; // [{startCol, endCol}] 순서대로
    merges.forEach(m=>{
      // 행2(r=1)에서 col7(H열) 이후의 가로 병합 셀
      if(m.s.r===1 && m.e.r===1 && m.s.c>=7 && m.e.c>m.s.c){
        dateGroupCols.push({startCol:m.s.c, endCol:m.e.c});
      }
    });
    dateGroupCols.sort((a,b)=>a.startCol-b.startCol);

    // 각 그룹에서 업체명(행3, r=2) 수집
    const dateGroups=[];
    dateGroupCols.forEach(({startCol,endCol})=>{
      const cols=[];
      for(let c=startCol;c<=endCol;c++){
        const cc=ws[XLSX.utils.encode_cell({r:2,c})];
        if(cc&&cc.v){
          const cname=String(cc.v).trim();
          const matched=matchCompany(cname,state.companies)||cname;
          cols.push({company:matched,col:c});
        }
      }
      if(cols.length>0)dateGroups.push({cols});
    });

    // 오더 주간(월~금)과 양식 날짜그룹을 순서로 매핑
    const compColMap={};
    days.forEach((d,dayIdx)=>{
      const ds=fmtFull(d);
      const group=dateGroups[dayIdx];
      if(!group)return;

      // 날짜가 공란이면 자동으로 해당 날짜 기입
      const dateCol=dateGroupCols[dayIdx]?.startCol;
      if(dateCol!==undefined){
        const dateAddr=XLSX.utils.encode_cell({r:1,c:dateCol});
        const existing=ws[dateAddr]||{};
        // Excel serial date로 변환
        const serial=Math.round((d.getTime()-new Date(Date.UTC(1899,11,30)).getTime())/86400000);
        ws[dateAddr]=Object.assign({},existing,{v:serial,t:'n',z:'YYYY-MM-DD'});
      }

      group.cols.forEach(({company,col})=>{
        compColMap[ds+'::'+company]=col;
      });
    });

    // 2. 품목 행 매핑
    // 양식: A=빈칸(col0), B=구분(col1), C=자재(col2), D=사이즈(col3)
    const BOARD_TYPES=['MDF','PB','MFC (WW)','MFC (IV)'];
    const boardRowMap={};
    for(let r=3;r<=range.e.r;r++){
      const tCell=ws[XLSX.utils.encode_cell({r,c:1})];
      if(!tCell||!tCell.v)continue;
      const btype=String(tCell.v).trim();
      if(!BOARD_TYPES.some(t=>btype===t))continue;
      const mCell=ws[XLSX.utils.encode_cell({r,c:2})];
      const sCell=ws[XLSX.utils.encode_cell({r,c:3})];
      const mat=String(mCell&&mCell.v!=null?mCell.v:'').trim();
      const size=String(sCell&&sCell.v!=null?sCell.v:'').trim();
      const boardIdx=state.boards.findIndex(b=>
        b.type===btype&&String(b.material).trim()===mat&&b.size.trim()===size
      );
      if(boardIdx>=0)boardRowMap[boardIdx]=r;
    }

    // 3. 수량 기재
    let filled=0;
    days.forEach(d=>{
      const ds=fmtFull(d);
      state.companies.forEach(company=>{
        const mapKey=ds+'::'+company;
        const col=compColMap[mapKey];
        if(col===undefined)return;

        const key=orderKey(ds,company);
        const ord=state.orders[key];if(!ord)return;

        Object.entries(ord.items).forEach(([bidxStr,item])=>{
          if(!hasRealItem(item))return;
          const bidx=parseInt(bidxStr);
          const row=boardRowMap[bidx];
          if(row===undefined)return;

          const addr=XLSX.utils.encode_cell({r:row,c:col});
          const q=String(item.qty).trim();
          const num=parseFloat(q);
          // 기존 셀 스타일 유지, 값만 교체
          const existing=ws[addr]||{};
          ws[addr]=Object.assign({},existing,{
            v:isNaN(num)?q:num,
            t:isNaN(num)?'s':'n'
          });
          filled++;
        });
      });
    });

    XLSX.writeFile(wb,`보드발주_${weekStr}.xlsx`);
    showToast(filled>0?`양식에 ${filled}개 수량 기재 완료!`:'매칭된 데이터가 없습니다. 양식 날짜와 주간을 확인하세요.');
  }catch(err){
    console.error(err);
    showToast('오류: '+err.message);
  }
}

  sections[name]=!sections[name];
  document.getElementById('body-'+name).classList.toggle('open',sections[name]);
  document.getElementById('chev-'+name).classList.toggle('open',sections[name]);
  if(name==='board'&&sections[name])renderBoardList();
  if(name==='excel'&&sections[name])document.getElementById('excel-week-label').textContent=fmtWeekRange(state.excelWeekOffset);
}
